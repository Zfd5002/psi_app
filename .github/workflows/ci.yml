name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      CI_PSI_DB: /tmp/psi_ci.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Prepare ephemeral PSI DB
        run: |
          python -m psi.tools.prepare_ci_db --db "$CI_PSI_DB"
          echo "PSI_DB_PATH=$CI_PSI_DB" >> "$GITHUB_ENV"

      - name: Compile
        run: python -m compileall -q psi

      - name: Pytest
        run: pytest -q

      - name: DI contract smoke
        run: python -m psi.tools.di_contract_smoke

      - name: DB schema sanity
        run: python -m psi.tools.db_schema_sanity

      - name: DI replay regression
        run: python -m psi.tools.di_replay_regression --limit 5
