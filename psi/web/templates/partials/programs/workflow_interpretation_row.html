{% set rm = molecule_by_id.get(r.molecule_id) if molecule_by_id is defined and r.molecule_id else None %}
<tr>
  <td><a href="/data/{{ r.id }}">#{{ r.id }}</a></td>
  <td>{% if rm %}<a href="/molecules/{{ rm.id }}">{{ rm.primary_id }}</a>{% elif r.molecule_id %}#{{ r.molecule_id }}{% else %}<span class="muted">program-level</span>{% endif %}</td>
  <td>{{ r.title }}</td>
  <td class="no-print"><a class="btn mini primary" href="/evidence/new?program_id={{ program.id }}{% if r.molecule_id %}&molecule_id={{ r.molecule_id }}{% endif %}{% if r.batch_id %}&batch_id={{ r.batch_id }}{% endif %}&return_to=/programs/{{ program.id }}/workflow">Create evidence</a></td>
</tr>
