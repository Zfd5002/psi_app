<div style="display:flex;gap:10px;flex-wrap:wrap;">
  <button class="btn primary" type="submit" onclick="document.getElementById('actionIntent').value='save'">Save Experiment Result</button>
  {% if not record %}
    <button class="btn" type="submit" onclick="document.getElementById('actionIntent').value='save_add_another'">Save and add another result</button>
  {% endif %}
  {% if record %}
    <button class="btn primary" type="submit" onclick="document.getElementById('actionIntent').value='approve'">Approve</button>
    <button class="btn" type="submit" onclick="document.getElementById('actionIntent').value='reject'">Reject</button>
  {% endif %}
  {% if record %}
    <a class="btn" href="{{ return_to if return_to is defined and return_to else ('/data/' ~ record.id) }}">Cancel</a>
  {% else %}
    <a class="btn" href="/data">Cancel</a>
  {% endif %}
</div>
