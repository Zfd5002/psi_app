<div class="grid cols-2">
  <div class="field">
    <label>Program</label>
    <select name="program_id" id="evProgram" required>
      {% for p in programs %}
        {% set sel = (ev and p.id==ev.program_id) or (not ev and prefill.program_id and p.id==prefill.program_id) %}
        <option value="{{ p.id }}" {% if sel %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label>Scope</label>
    <div class="help">Program-level evidence uses no molecule/batch. Molecule-level uses molecule only. Batch-level uses batch (and should align with the chosen molecule).</div>
    <div class="grid cols-2">
      <div class="field">
        <label>Molecule (optional)</label>
        <select name="molecule_id" id="evMolecule">
          <option value="">(none)</option>
          {% for m in molecules %}
            {% set sel = (ev and ev.molecule_id==m.id) or (not ev and prefill.molecule_id and prefill.molecule_id==m.id) %}
            <option value="{{ m.id }}" {% if sel %}selected{% endif %}>{{ m.primary_id }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Batch (optional)</label>
        <select name="batch_id" id="evBatch">
          <option value="">(none)</option>
          {% for b in batches %}
            {% set sel = (ev and ev.batch_id==b.id) or (not ev and prefill.batch_id and prefill.batch_id==b.id) %}
            <option value="{{ b.id }}" {% if sel %}selected{% endif %}>{{ b.batch_id }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
</div>

<div class="grid cols-3">
  <div class="field">
    <label>Domain</label>
    <select name="domain" id="evDomain" required>
      {% for d in domains %}
        <option value="{{ d }}" {% if (ev and ev.domain==d) %}selected{% endif %}>{{ d }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label>Evidence type</label>
    <select name="evidence_type" id="evType" required></select>
  </div>
  <div class="field">
    <label>Strength (0–4)</label>
    <input type="number" min="0" max="4" step="1" name="strength" value="{{ ev.strength if ev else 0 }}" required />
    <div class="help">Presence threshold is configured in the rules YAML (default: strength ≥ 2).</div>
  </div>
</div>

<div class="field">
  <label>Summary</label>
  <input name="summary" value="{{ ev.summary if ev else '' }}" required placeholder="One sentence claim" />
</div>

<div class="field">
  <label>Details</label>
  <textarea name="details" placeholder="Longer narrative / context">{{ ev.details if ev else '' }}</textarea>
</div>
