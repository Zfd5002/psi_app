{% extends "base.html" %}
{% block title %}Decision #{{ snap.id }} | PSI{% endblock %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;">
    <div>
      <h1 style="margin:0;">Decision #{{ snap.id }} ({{ snap.decision_key }})</h1>
      <div class="muted">Rules {{ snap.rules_version }} · created {{ snap.created_at }}</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <a class="btn" href="/decisions">Back</a>
      <a class="btn primary" href="/decisions/{{ snap.id }}?print_view=1" target="_blank">Print view</a>
    </div>
  </div>

  {% include "decisions/_decision_body.html" %}
</div>
{% endblock %}
