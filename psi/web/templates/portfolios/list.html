{% extends "base.html" %}
{% block title %}Portfolios | PSI{% endblock %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
    <h1>Portfolios</h1>
    <a class="btn primary" href="/portfolios/new">New Portfolio</a>
  </div>
  <table class="table">
    <thead><tr><th>Name</th><th>Description</th><th>Created</th></tr></thead>
    <tbody>
      {% for p in portfolios %}
      <tr>
        <td><a href="/portfolios/{{ p.id }}">{{ p.name }}</a></td>
        <td class="muted">{{ p.description or '' }}</td>
        <td class="muted">{{ p.created_at }}</td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted">No portfolios yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
