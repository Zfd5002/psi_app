<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PSI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="{{ body_class if body_class is defined else '' }}">
  <div class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/">PSI</a>
      <a href="/programs">Programs</a>
      <a href="/portfolios">Portfolios</a>
      <a href="/molecules">Molecules</a>
      <a href="/batches">Batches</a>
      <a href="/data">Lab Notebook</a>
      <a href="/evidence">Evidence</a>
      <a href="/files">Files</a>
      <a href="/decisions">Decisions</a>
      <a href="/reports">Reports</a>
      <a href="/lineage/programs">Lineage</a>
      <a href="/search">Search</a>
    </div>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
    <div class="footer">PSI {{ PSI_VERSION or '' }} · Local-first (SQLite) · No auth · All changes audited.</div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
